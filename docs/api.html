<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataGrid — API Documentation</title>
<link rel="stylesheet" href="../dist/datagrid.css">
<link rel="stylesheet" href="../demo/demo.css">
<style>
  /* ---- docs 로컬 토큰 (프레임워크 토큰 아님 — 문서 페이지 전용) ---- */
  body {
    --doc-code-bg: rgba(24, 29, 31, 0.055);
    --doc-rule: rgba(24, 29, 31, 0.09);
    --doc-note-bg: rgba(24, 29, 31, 0.028);
    --doc-warn: #b26a00;
    --doc-warn-bg: rgba(240, 160, 0, 0.09);
  }
  body.dark {
    --doc-code-bg: rgba(255, 255, 255, 0.1);
    --doc-rule: rgba(255, 255, 255, 0.13);
    --doc-note-bg: rgba(255, 255, 255, 0.04);
    --doc-warn: #f0b429;
    --doc-warn-bg: rgba(240, 180, 41, 0.1);
  }

  /* ---- docs layout ---- */
  .docs-layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    gap: 36px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .docs-layout { grid-template-columns: 1fr; }
    .docs-sidebar { position: static !important; max-height: none !important; }
  }

  /* ---- sidebar ---- */
  .docs-sidebar {
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding-right: 8px;
  }
  .docs-search {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    margin-bottom: 14px;
    font: inherit;
    color: var(--page-fg);
    background: var(--page-card);
    border: 1px solid var(--page-border);
    border-radius: 8px;
    outline: none;
  }
  .docs-search:focus { border-color: var(--page-accent); }
  .docs-nav-section { margin-bottom: 4px; }
  .docs-nav-section > a {
    display: block;
    padding: 6px 10px;
    font-weight: 600;
    font-size: 13px;
    color: var(--page-fg);
    text-decoration: none;
    border-radius: 6px;
  }
  .docs-nav-entries { margin: 0 0 6px; }
  .docs-nav-entries a {
    display: block;
    padding: 3px 10px 3px 22px;
    font-size: 12.5px;
    color: var(--page-muted);
    text-decoration: none;
    border-left: 2px solid var(--page-border);
    margin-left: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .docs-nav-section > a:hover, .docs-nav-entries a:hover {
    color: var(--page-accent);
    background: rgba(33, 150, 243, 0.07);
  }
  .docs-nav-section > a.active, .docs-nav-entries a.active {
    color: var(--page-accent);
    border-left-color: var(--page-accent);
  }
  .docs-nav-section > a.active { background: rgba(33, 150, 243, 0.1); }
  .docs-nav-hidden { display: none; }

  /* ---- content ---- */
  .docs-content { min-width: 0; }
  .docs-meta { color: var(--page-muted); font-size: 12.5px; margin-bottom: 24px; }
  .api-section { margin-bottom: 12px; }
  .api-section > h2 {
    font-size: 20px;
    margin: 36px 0 10px;
    padding-top: 14px;
    border-top: 1px solid var(--page-border);
    scroll-margin-top: 12px;
  }
  .api-section:first-child > h2 { border-top: none; margin-top: 0; padding-top: 0; }
  .api-section .intro { color: var(--page-muted); max-width: 760px; line-height: 1.75; }
  .api-section .intro p { margin: 0 0 10px; }
  .api-section .intro p:last-child { margin-bottom: 0; }
  /* 본문 인라인 코드는 조용하게 — 강조색은 링크에만 남긴다 */
  .api-section .intro code, .api-entry code {
    background: var(--doc-code-bg);
    color: inherit;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
  }
  .api-section .intro a, .api-entry a { color: var(--page-accent); }
  .api-section .intro a code, .api-entry a code { color: inherit; }

  .api-group-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--page-muted);
    margin: 26px 0 2px;
  }

  .api-entry {
    background: var(--page-card);
    border: 1px solid var(--page-border);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 12px 0;
    scroll-margin-top: 12px;
  }
  .api-entry-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .api-entry-name {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--page-fg);
  }
  .api-entry-name a { color: inherit; text-decoration: none; }
  .api-entry-name a:hover::after { content: " #"; color: var(--page-accent); }
  .api-badge {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(33, 150, 243, 0.12);
    color: var(--page-accent);
  }
  .api-badge.required { background: rgba(224, 37, 37, 0.1); color: #d02020; }
  .api-badge.since { background: rgba(22, 160, 78, 0.12); color: #0d8a44; text-transform: none; }
  body.dark .api-badge.since { color: #4cd587; }
  /* entry.demo — features.html 데모 카드로 가는 링크 배지 */
  a.api-badge.demo { text-transform: none; text-decoration: none; cursor: pointer; }
  a.api-badge.demo:hover { text-decoration: underline; }
  .api-type {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    color: var(--page-muted);
  }
  .api-default { font-size: 12px; color: var(--page-muted); }
  .api-default code { background: none; padding: 0; color: inherit; }
  .api-entry-desc { margin: 10px 0 0; line-height: 1.75; max-width: 760px; }
  .api-entry-desc p { margin: 0 0 10px; }
  .api-entry-desc > :last-child { margin-bottom: 0; }
  .api-entry-desc ul, .api-entry-desc ol { margin: 0 0 10px; padding-left: 20px; }
  .api-entry-desc li { margin: 3px 0; }

  /* ---- 하위 속성 표 (entry.props) ---- */
  .api-block-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--page-muted);
    margin: 18px 0 6px;
  }
  .api-props table { border-collapse: collapse; width: 100%; max-width: 760px; }
  .api-props th, .api-props td {
    text-align: left;
    vertical-align: top;
    padding: 9px 0;
    border-top: 1px solid var(--doc-rule);
    line-height: 1.7;
    font-weight: 400;
    font-size: 13.5px;
  }
  .api-props tr:first-child th, .api-props tr:first-child td { border-top: none; }
  .api-props th { width: 210px; padding-right: 18px; }
  @media (max-width: 700px) {
    .api-props th, .api-props td { display: block; width: auto; padding: 0; }
    .api-props th { border-top: 1px solid var(--doc-rule); padding-top: 10px; }
    .api-props td { padding: 2px 0 10px; }
  }
  .api-props th > code {
    font-weight: 700;
    background: none;
    padding: 0;
    font-size: 13px;
  }
  .api-props-type, .api-props-meta {
    display: block;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--page-muted);
  }
  .api-props-type { font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
  .api-props td > :last-child { margin-bottom: 0; }
  .api-props td p { margin: 0 0 6px; }

  /* ---- 보조 설명 블록 (entry.notes) ---- */
  .api-note { margin: 16px 0 0; max-width: 760px; line-height: 1.75; }
  .api-note-title {
    font-size: 13.5px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--page-fg);
  }
  .api-note p { margin: 0 0 8px; }
  .api-note > :last-child, .api-note-body > :last-child { margin-bottom: 0; }
  .api-note ul, .api-note ol { margin: 0 0 8px; padding-left: 20px; }
  .api-note li { margin: 3px 0; }
  .api-note.warn, .api-note.tip {
    padding: 12px 14px;
    border-radius: 8px;
    border-left: 3px solid var(--doc-rule);
    background: var(--doc-note-bg);
  }
  .api-note.warn { border-left-color: var(--doc-warn); background: var(--doc-warn-bg); }
  .api-note.warn .api-note-title { color: var(--doc-warn); }

  .api-signature {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
    color: var(--page-muted);
    margin-top: 2px;
    word-break: break-all;
  }

  /* .api-example / .copy-btn / .hl-* 스타일은 demo/demo.css(공용)에 있습니다 */
  .api-entry .api-example { margin: 12px 0 2px; }

  .api-table { border-collapse: collapse; margin: 12px 0; width: 100%; max-width: 760px; }
  .api-table th, .api-table td {
    text-align: left;
    vertical-align: top;
    padding: 9px 14px 9px 0;
    border-bottom: 1px solid var(--doc-rule);
    font-size: 13.5px;
    line-height: 1.7;
  }
  .api-table th {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--page-muted);
    border-bottom-color: var(--page-border);
  }
  kbd {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px;
    padding: 1px 6px;
    border: 1px solid var(--page-border);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--page-card);
  }

  .docs-no-results {
    color: var(--page-muted);
    padding: 40px 0;
    text-align: center;
    display: none;
  }
  mark { background: rgba(240, 160, 0, 0.35); color: inherit; border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body>
<div class="page">

  <header class="topnav">
    <span class="brand"><span class="brand-mark">DG</span>DataGrid</span>
    <nav>
      <a href="../index.html">Template</a>
      <a href="../examples/features.html">Features</a>
      <a href="../examples/components.html">Components</a>
      <a class="active" href="api.html">API Docs</a>
    </nav>
    <span class="spacer"></span>
    <button class="tb-btn" id="themeToggle" type="button">🌙 Dark</button>
  </header>

  <div class="docs-layout">
    <aside class="docs-sidebar">
      <input class="docs-search" id="docsSearch" type="search" placeholder="API 검색… ( / )">
      <div id="docsNav"></div>
    </aside>

    <main class="docs-content">
      <h1 id="docsTitle">API Documentation</h1>
      <p class="docs-meta" id="docsMeta"></p>
      <div id="docsBody"></div>
      <p class="docs-no-results" id="noResults">검색 결과가 없습니다.</p>
    </main>
  </div>

</div>

<script src="../demo/highlight.js"></script>
<script src="api-data.js"></script>
<script>
(function () {
  'use strict';
  var DATA = window.ApiDocs;

  /* ------------------------------------------------------------------
   * Helpers (구문 강조는 demo/highlight.js 공용 모듈 사용)
   * ---------------------------------------------------------------- */
  var esc = Highlight.escapeHtml;
  var highlight = Highlight.js;

  function entryId(section, entry) {
    return section.id + '-' + entry.name.replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '');
  }

  function exampleBlock(code) {
    return (
      '<pre class="api-example"><button class="copy-btn" type="button">Copy</button><code>' +
      highlight(code) + '</code></pre>'
    );
  }

  /* entry.props — 객체형 옵션의 하위 속성을 산문 대신 표로 */
  function propsBlock(props, title) {
    var html = '<div class="api-props">' +
      '<div class="api-block-title">' + esc(title || '속성') + '</div><table><tbody>';
    props.forEach(function (p) {
      var meta = [];
      if (p.default !== undefined) meta.push('기본 ' + p.default);
      if (p.since) meta.push('v' + p.since);
      html += '<tr><th scope="row"><code>' + esc(p.name) + '</code>' +
        (p.type ? '<span class="api-props-type">' + esc(p.type) + '</span>' : '') +
        (meta.length ? '<span class="api-props-meta">' + esc(meta.join(' · ')) + '</span>' : '') +
        '</th><td>' + (p.description || '') + '</td></tr>';
    });
    return html + '</tbody></table></div>';
  }

  /* entry.notes — 주제별 보조 설명. variant: 'warn' | 'tip'이면 콜아웃 박스 */
  function notesBlock(notes) {
    return notes.map(function (n) {
      return '<div class="api-note' + (n.variant ? ' ' + esc(n.variant) : '') + '">' +
        (n.title ? '<div class="api-note-title">' + esc(n.title) + '</div>' : '') +
        '<div class="api-note-body">' + n.body + '</div></div>';
    }).join('');
  }

  /* 검색 대상 텍스트 — description 밖으로 옮긴 내용도 검색되어야 한다 */
  function entryText(e) {
    var parts = [e.name, e.description || '', e.signature || '', e.type || '', e.payload || ''];
    (e.props || []).forEach(function (p) {
      parts.push(p.name, p.type || '', p.description || '');
    });
    (e.notes || []).forEach(function (n) { parts.push(n.title || '', n.body); });
    return parts.join(' ').toLowerCase();
  }

  /* ------------------------------------------------------------------
   * Render
   * ---------------------------------------------------------------- */
  document.getElementById('docsMeta').textContent =
    DATA.library + ' v' + DATA.version + ' · 마지막 수정 ' + DATA.updated;
  document.title = DATA.library + ' — API Documentation';

  var body = document.getElementById('docsBody');
  var nav = document.getElementById('docsNav');
  var navHtml = '';
  var bodyHtml = '';

  DATA.sections.forEach(function (section) {
    /* --- nav --- */
    navHtml += '<div class="docs-nav-section" data-section="' + section.id + '">' +
      '<a href="#' + section.id + '">' + esc(section.title) + '</a>';
    if (section.entries.length) {
      navHtml += '<div class="docs-nav-entries">';
      section.entries.forEach(function (e) {
        navHtml += '<a href="#' + entryId(section, e) + '" data-entry>' + esc(e.name) + '</a>';
      });
      navHtml += '</div>';
    }
    navHtml += '</div>';

    /* --- content --- */
    bodyHtml += '<section class="api-section" id="' + section.id + '" data-section-block>' +
      '<h2>' + esc(section.title) + '</h2>' +
      (section.intro ? '<div class="intro">' + section.intro + '</div>' : '');

    var lastGroup = null;
    section.entries.forEach(function (e) {
      if (e.group && e.group !== lastGroup) {
        bodyHtml += '<div class="api-group-label">' + esc(e.group) + '</div>';
        lastGroup = e.group;
      }
      var id = entryId(section, e);
      bodyHtml += '<article class="api-entry" id="' + id + '" data-name="' + esc(e.name.toLowerCase()) + '">';
      bodyHtml += '<div class="api-entry-head">';
      bodyHtml += '<span class="api-entry-name"><a href="#' + id + '">' + esc(e.name) + '</a></span>';
      if (e.kind) bodyHtml += '<span class="api-badge">' + esc(e.kind) + '</span>';
      if (e.required) bodyHtml += '<span class="api-badge required">required</span>';
      if (e.since) bodyHtml += '<span class="api-badge since">since v' + esc(e.since) + '</span>';
      if (e.demo) {
        bodyHtml += '<a class="api-badge demo" target="_blank" rel="noopener" ' +
          'href="../examples/features.html#' + esc(e.demo) + '" ' +
          'title="features.html에서 이 기능의 Example/View Source 카드로 이동">예제 ↗</a>';
      }
      if (e.type) bodyHtml += '<span class="api-type">' + esc(e.type) + '</span>';
      if (e.payload) bodyHtml += '<span class="api-type">' + esc(e.payload) + '</span>';
      if (e.default !== undefined) {
        bodyHtml += '<span class="api-default">기본값: <code>' + esc(e.default) + '</code></span>';
      }
      bodyHtml += '</div>';
      if (e.signature) bodyHtml += '<div class="api-signature">' + esc(e.signature) + '</div>';
      if (e.description) bodyHtml += '<div class="api-entry-desc">' + e.description + '</div>';
      if (e.props) bodyHtml += propsBlock(e.props, e.propsTitle);
      if (e.notes) bodyHtml += notesBlock(e.notes);
      if (e.example) bodyHtml += exampleBlock(e.example);
      bodyHtml += '</article>';
    });
    bodyHtml += '</section>';
  });

  nav.innerHTML = navHtml;
  body.innerHTML = bodyHtml;

  /* ------------------------------------------------------------------
   * Copy buttons
   * ---------------------------------------------------------------- */
  body.addEventListener('click', function (e) {
    var btn = e.target.closest('.copy-btn');
    if (!btn) return;
    var code = btn.parentNode.querySelector('code').textContent;
    var done = function () {
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done);
    else {
      var ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }
  });

  /* ------------------------------------------------------------------
   * Search — 이름/설명 매칭, 섹션 단위로 숨김
   * ---------------------------------------------------------------- */
  var searchInput = document.getElementById('docsSearch');
  var noResults = document.getElementById('noResults');

  function applySearch(q) {
    q = q.trim().toLowerCase();
    var any = false;
    DATA.sections.forEach(function (section) {
      var sectionEl = document.getElementById(section.id);
      var navSection = nav.querySelector('[data-section="' + section.id + '"]');
      var sectionMatch = !q || section.title.toLowerCase().indexOf(q) !== -1;
      var visibleEntries = 0;

      section.entries.forEach(function (e) {
        var id = entryId(section, e);
        var entryEl = document.getElementById(id);
        var navLink = navSection.querySelector('a[href="#' + id + '"]');
        var match = !q || sectionMatch || entryText(e).indexOf(q) !== -1;
        entryEl.style.display = match ? '' : 'none';
        if (navLink) navLink.classList.toggle('docs-nav-hidden', !match);
        if (match) visibleEntries++;
      });

      var showSection = sectionMatch || visibleEntries > 0;
      sectionEl.style.display = showSection ? '' : 'none';
      navSection.classList.toggle('docs-nav-hidden', !showSection);
      if (showSection) any = true;
    });
    noResults.style.display = any ? 'none' : 'block';
  }

  searchInput.addEventListener('input', function () { applySearch(this.value); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchInput &&
        !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  /* ------------------------------------------------------------------
   * Scrollspy — 현재 보이는 섹션/엔트리를 사이드바에 표시
   * ---------------------------------------------------------------- */
  var navLinks = {};
  nav.querySelectorAll('a').forEach(function (a) {
    navLinks[a.getAttribute('href').slice(1)] = a;
  });
  var spyTargets = Array.prototype.slice.call(
    body.querySelectorAll('.api-section[id], .api-entry[id]')
  );
  var activeLink = null;

  function updateSpy() {
    var line = 90; /* 기준선(px) */
    var current = null;
    for (var i = 0; i < spyTargets.length; i++) {
      var rect = spyTargets[i].getBoundingClientRect();
      if (spyTargets[i].style.display === 'none') continue;
      if (rect.top <= line) current = spyTargets[i];
      else break;
    }
    var link = current ? navLinks[current.id] : null;
    if (link !== activeLink) {
      if (activeLink) activeLink.classList.remove('active');
      if (link) {
        link.classList.add('active');
        /* 사이드바 스크롤 추적 */
        var sb = document.querySelector('.docs-sidebar');
        var lr = link.getBoundingClientRect();
        var sr = sb.getBoundingClientRect();
        if (lr.top < sr.top + 40 || lr.bottom > sr.bottom - 40) {
          link.scrollIntoView({ block: 'center' });
        }
      }
      activeLink = link;
    }
  }
  window.addEventListener('scroll', updateSpy, { passive: true });
  updateSpy();

  /* ------------------------------------------------------------------
   * Dark mode
   * ---------------------------------------------------------------- */
  var themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', function () {
    var dark = document.body.classList.toggle('dark');
    themeBtn.textContent = dark ? '☀️ Light' : '🌙 Dark';
  });
})();
</script>
</body>
</html>
